services:
  postgres:
    image: postgres:16-alpine
    container_name: deal-radar-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deal_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deal_radar_password}
      POSTGRES_DB: ${POSTGRES_DB:-deal_radar}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deal-radar-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    container_name: deal-radar-backend
    working_dir: /app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-4000}:${PORT:-4000}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://deal_radar:deal_radar_password@postgres:5432/deal_radar?schema=public}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    volumes:
      - .:/app
      - backend-node-modules:/app/node_modules
      - backend-app-node-modules:/app/apps/backend/node_modules
    command: sh -c "npm install && npm run prisma:generate -w @deal-radar/backend && npm run dev -w @deal-radar/backend"

volumes:
  postgres-data:
  redis-data:
  backend-node-modules:
  backend-app-node-modules:
